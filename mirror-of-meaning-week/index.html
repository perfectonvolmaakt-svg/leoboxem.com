<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror of Meaning Masterclass Week · Leo Boxem</title>
  <link rel="icon" type="image/png" href="../images/ryf-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #fdf7f5;
      color: #502a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .message {
      max-width: 560px;
      margin-bottom: 56px;
    }

    p.line {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 500;
      line-height: 1.7;
      color: #502a1a;
      margin-bottom: 0.5em;
    }

    p.line:last-child {
      margin-bottom: 0;
    }

    p.line em {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.15em;
      color: #b27931;
    }

    .cover-img {
      width: 100%;
      max-width: 860px;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="message">
    <p class="line">The <em>Mirror of Meaning Masterclass Week</em> was postponed.</p>
    <p class="line">Registration opens next week.</p>
    <p class="line">Below are the dates to block already!</p>
  </div>

  <img class="cover-img" src="../images/MoM2 Cover.jpg" alt="Mirror of Meaning Masterclass Week">

</body>
</html>
