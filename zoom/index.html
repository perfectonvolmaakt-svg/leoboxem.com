<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Leo on Zoom · Remember Your Future™</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="../images/ryf-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #fdf7f5;
      --dark-brown: #502a1a;
      --gold:       #b27931;
      --gold-light: #c39950;
      --taupe:      #8c756a;
      --mocha:      #3a2d24;
      --white:      #ffffff;
      --blush:      #e1c6b7;

      --f-head:    'League Spartan', sans-serif;
      --f-display: 'Outfit', sans-serif;
      --f-serif:   'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--f-display);
      background: var(--cream);
      color: var(--dark-brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Banner image */
    .banner {
      width: 100%;
      max-height: 480px;
      overflow: hidden;
    }
    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* Main content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 32px 56px;
    }

    .label {
      font-family: var(--f-head);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--f-display);
      font-size: clamp(32px, 5vw, 62px);
      font-weight: 700;
      color: var(--dark-brown);
      line-height: 1.1;
      margin-bottom: 32px;
    }

    .zoom-link {
      display: inline-block;
      font-family: var(--f-serif);
      font-style: italic;
      font-size: clamp(18px, 2.5vw, 26px);
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1.5px solid rgba(178,121,49,.35);
      padding-bottom: 4px;
      transition: opacity .2s;
    }
    .zoom-link:hover { opacity: .7; }

    /* Footer */
    footer {
      background: var(--mocha);
      color: rgba(253,247,245,.45);
      text-align: center;
      padding: 28px 32px;
      font-family: var(--f-head);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    @media (max-width: 500px) {
      .banner { max-height: 280px; }
    }
  </style>
</head>
<body>

  <div class="banner">
    <img src="../images/ryf-banner.jpg" alt="Remember Your Future — Leo Boxem">
  </div>

  <div class="content">
    <p class="label">Remember Your Future™</p>
    <h1>Join Leo on Zoom</h1>
    <a href="https://us02web.zoom.us/j/*******002?pwd=b1QzMmtzeG1UTHpiYTdnMzdka3ovZz09" class="zoom-link">
      Click here to enter Leo's Zoom Room
    </a>
  </div>

  <footer>Remember Your Future™ · Leo Boxem · Ibiza, Spain</footer>

</body>
</html>
